name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a bug. Remove credentials, client profiles,
        Terraform state, QR codes, server addresses, and sensitive logs.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checks
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: This report contains no credentials or sensitive deployment data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or branch name.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Terraform version, shell version, AWS region, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      description: Paste only the minimum output needed after removing sensitive values.
      render: shell
